name: Review Sentinel attestation preservation

on:
  push:
    branches:
      - fix/sentinel-preserve-attestations

permissions:
  contents: read

jobs:
  static-review:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run attestation and OCI regression tests
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
      - name: Validate Sentinel workflow security policy
        run: python3 scripts/ci/validate-sentinel-safety-image-workflow.py
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/sentinel-safety-image.yml \
            .github/workflows/sentinel-safety-image-publish.yml \
            .github/workflows/sentinel-safety-image-static.yml \
            .github/workflows/sentinel-attestation-review.yml
