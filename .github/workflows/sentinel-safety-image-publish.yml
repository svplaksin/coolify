name: Publish Sentinel safety image

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Sentinel safety image workflow run ID
        required: true
        type: string
      build_run_attempt:
        description: Exact reviewed attempt number of the build workflow run
        required: true
        type: string

permissions: {}

concurrency:
  group: sentinel-safety-publish-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed image
    permissions:
      actions: read
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
      EXPECTED_BUILD_HEAD_BRANCH: main
      EXPECTED_BUILD_HEAD_SHA: ${{ github.workflow_sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/coolify-sentinel-safety
      TAG: 4.7.5-bd04cd1f34cc854ee44be3715f7c0afb3e0a8b7a-build-${{ inputs.build_run_id }}-publish-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      EXPECTED_IMAGE_SOURCE_SHA: bd04cd1f34cc854ee44be3715f7c0afb3e0a8b7a
      EXPECTED_VERSION: 4.7.5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify source build run
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run_json="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID"
          )"
          attempt_json="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/attempts/$BUILD_RUN_ATTEMPT"
          )"
          for payload in "$run_json" "$attempt_json"; do
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run_id "$BUILD_RUN_ID" \
              --arg attempt "$BUILD_RUN_ATTEMPT" \
              --arg head_branch "$EXPECTED_BUILD_HEAD_BRANCH" \
              --arg head_sha "$EXPECTED_BUILD_HEAD_SHA" '
                (.id | tostring) == $run_id and
                .run_attempt == ($attempt | tonumber) and
                .status == "completed" and
                .conclusion == "success" and
                .event == "workflow_dispatch" and
                .head_branch == $head_branch and
                .head_sha == $head_sha and
                .path == ".github/workflows/sentinel-safety-image.yml" and
                .repository.full_name == $repository
              ' <<< "$payload"
          done

      - name: Download verified architecture artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts before publication
        run: |
          mapfile -t artifacts < <(
            find "$RUNNER_TEMP/images" -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort
          )
          expected=(image-amd64 image-arm64)
          [[ ${#artifacts[@]} -eq 2 ]]
          [[ "${artifacts[*]}" == "${expected[*]}" ]]

          for arch in amd64 arm64; do
            index="$RUNNER_TEMP/images/image-$arch/index.json"
            test -f "$index"
            [[ "$(jq --arg arch "$arch" \
              '[.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == $arch
              )] | length' "$index")" -eq 1 ]]
            digest="$(jq -er --arg arch "$arch" \
              '.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == $arch
              ) | .digest' "$index")"

            source="oci-layout://${index%/index.json}@$digest"
            labels="$(
              docker buildx imagetools inspect "$source" \
                --format '{{ json .Image.Config.Labels }}'
            )"
            [[ "$(jq -r '.["org.opencontainers.image.revision"]' <<< "$labels")" \
              == "$EXPECTED_IMAGE_SOURCE_SHA" ]]
            [[ "$(jq -r '.["org.opencontainers.image.version"]' <<< "$labels")" \
              == "$EXPECTED_VERSION" ]]
          done

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          probe_log="$RUNNER_TEMP/tag-probe.log"
          set +e
          docker buildx imagetools inspect "$IMAGE:$TAG" \
            >"$probe_log" 2>&1
          probe_status=$?
          set -e

          if [[ $probe_status -eq 0 ]]; then
            echo "Refusing to overwrite existing tag: $IMAGE:$TAG" >&2
            exit 1
          fi

          probe_error="$(tr '[:upper:]' '[:lower:]' < "$probe_log")"
          if grep -Fq "$IMAGE:$TAG" "$probe_log" && \
            grep -Eq \
              'manifest unknown|name unknown|no such manifest|: not found' \
              <<< "$probe_error"; then
            echo "Confirmed unused publication tag: $IMAGE:$TAG"
          else
            cat "$probe_log" >&2
            echo "Unable to prove that the tag is unused; refusing publication" >&2
            exit "$probe_status"
          fi

      - name: Publish multi-architecture manifest
        id: publish
        run: |
          sources=()
          for arch in amd64 arm64; do
            index="$RUNNER_TEMP/images/image-$arch/index.json"
            digest="$(jq -er --arg arch "$arch" \
              '.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == $arch
              ) | .digest' "$index")"
            sources+=("oci-layout://${index%/index.json}@$digest")
          done

          labels="$(
            docker buildx imagetools inspect "${sources[0]}" \
              --format '{{ json .Image.Config.Labels }}' \
              | jq -r 'to_entries[] | "--annotation=index:\(.key)=\(.value)"'
          )"
          mapfile -t annotations <<< "$labels"
          docker buildx imagetools create \
            "${annotations[@]}" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --tag "$IMAGE:$TAG" \
            "${sources[@]}"

          digest="$(jq -er \
            '.["containerimage.descriptor"].digest
              | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/metadata.json")"
          registry_manifest="$(
            docker buildx imagetools inspect "$IMAGE:$TAG" \
              --format '{{json .Manifest}}'
          )"
          registry_digest="$(jq -er '.digest' <<< "$registry_manifest")"
          if [[ "$registry_digest" != "$digest" ]]; then
            echo "Registry digest does not match create metadata" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest"

      - name: Verify the published immutable manifest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          raw="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          jq -e '
            [.manifests[].platform
              | select(.os == "linux")
              | "\(.os)/\(.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' <<< "$raw"

          for platform in linux/amd64 linux/arm64; do
            labels="$(
              docker buildx imagetools inspect "$IMAGE@$DIGEST" \
                --format "{{ json (index .Image \"$platform\").Config.Labels }}"
            )"
            [[ "$(jq -r '.["org.opencontainers.image.revision"]' <<< "$labels")" \
              == "$EXPECTED_REVISION" ]]
            [[ "$(jq -r '.["org.opencontainers.image.version"]' <<< "$labels")" \
              == "$EXPECTED_VERSION" ]]
          done
