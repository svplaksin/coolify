name: Publish Sentinel safety image

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Sentinel safety image workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: sentinel-safety-publish-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed image
    permissions:
      actions: read
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/coolify-sentinel-safety
      TAG: 4.7.5-bd04cd1f34cc854ee44be3715f7c0afb3e0a8b7a-build-${{ inputs.build_run_id }}-publish-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      EXPECTED_REVISION: bd04cd1f34cc854ee44be3715f7c0afb3e0a8b7a
      EXPECTED_VERSION: 4.7.5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify source build run
        run: |
          run_json="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID"
          )"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .path == ".github/workflows/sentinel-safety-image.yml" and
            .repository.full_name == $repository
          ' <<< "$run_json"

      - name: Download verified architecture artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts before publication
        run: |
          mapfile -t artifacts < <(
            find "$RUNNER_TEMP/images" -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort
          )
          expected=(image-amd64 image-arm64)
          [[ ${#artifacts[@]} -eq 2 ]]
          [[ "${artifacts[*]}" == "${expected[*]}" ]]

          for arch in amd64 arm64; do
            index="$RUNNER_TEMP/images/image-$arch/index.json"
            test -f "$index"
            [[ "$(jq --arg arch "$arch" \
              '[.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == $arch
              )] | length' "$index")" -eq 1 ]]
            digest="$(jq -er --arg arch "$arch" \
              '.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == $arch
              ) | .digest' "$index")"

            source="oci-layout://${index%/index.json}@$digest"
            labels="$(
              docker buildx imagetools inspect "$source" \
                --format '{{ json .Image.Config.Labels }}'
            )"
            [[ "$(jq -r '.["org.opencontainers.image.revision"]' <<< "$labels")" \
              == "$EXPECTED_REVISION" ]]
            [[ "$(jq -r '.["org.opencontainers.image.version"]' <<< "$labels")" \
              == "$EXPECTED_VERSION" ]]
          done

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag: $IMAGE:$TAG" >&2
            exit 1
          fi

      - name: Publish multi-architecture manifest
        id: publish
        run: |
          sources=()
          for arch in amd64 arm64; do
            index="$RUNNER_TEMP/images/image-$arch/index.json"
            digest="$(jq -er --arg arch "$arch" \
              '.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == $arch
              ) | .digest' "$index")"
            sources+=("oci-layout://${index%/index.json}@$digest")
          done

          labels="$(
            docker buildx imagetools inspect "${sources[0]}" \
              --format '{{ json .Image.Config.Labels }}' \
              | jq -r 'to_entries[] | "--annotation=index:\(.key)=\(.value)"'
          )"
          mapfile -t annotations <<< "$labels"
          docker buildx imagetools create \
            "${annotations[@]}" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --tag "$IMAGE:$TAG" \
            "${sources[@]}"

          digest="$(jq -er '.["containerimage.digest"]' \
            "$RUNNER_TEMP/metadata.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest"

      - name: Verify the published immutable manifest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          raw="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          jq -e '
            [.manifests[].platform
              | select(.os == "linux")
              | "\(.os)/\(.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' <<< "$raw"

          for platform in linux/amd64 linux/arm64; do
            labels="$(
              docker buildx imagetools inspect "$IMAGE@$DIGEST" \
                --format "{{ json (index .Image \"$platform\").Config.Labels }}"
            )"
            [[ "$(jq -r '.["org.opencontainers.image.revision"]' <<< "$labels")" \
              == "$EXPECTED_REVISION" ]]
            [[ "$(jq -r '.["org.opencontainers.image.version"]' <<< "$labels")" \
              == "$EXPECTED_VERSION" ]]
          done
