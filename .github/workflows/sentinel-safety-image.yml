name: Build Sentinel safety image

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sentinel-safety-image-bd04cd1
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed Coolify image
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      ref: bd04cd1f34cc854ee44be3715f7c0afb3e0a8b7a
      coolify: 4.7.5

  verify:
    name: Verify OCI artifacts
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed workflow verifier
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download both architecture artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Verify artifact count, platforms, revision, and version
        env:
          EXPECTED_IMAGE_SOURCE_SHA: bd04cd1f34cc854ee44be3715f7c0afb3e0a8b7a
          EXPECTED_VERSION: 4.7.5
        run: |
          mapfile -t artifacts < <(
            find "$RUNNER_TEMP/images" -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort
          )
          expected=(image-amd64 image-arm64)
          [[ ${#artifacts[@]} -eq 2 ]]
          [[ "${artifacts[*]}" == "${expected[*]}" ]]

          for arch in amd64 arm64; do
            digest="$(python3 scripts/ci/verify-sentinel-oci-layout.py \
              --layout "$RUNNER_TEMP/images/image-$arch" \
              --arch "$arch" \
              --revision "$EXPECTED_IMAGE_SOURCE_SHA" \
              --version "$EXPECTED_VERSION")"
            echo "Verified $arch OCI image manifest: $digest"
          done
